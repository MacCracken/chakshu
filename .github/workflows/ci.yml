name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:                    # reusable by release.yml as a gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Pulls the version pinned in cyrius.cyml [package].cyrius and
        # runs the install.sh that ships inside the release tarball.
        # The bundled installer sets up the versioned layout
        # (~/.cyrius/versions/<ver>/) that cyrius 6.0.1+ requires —
        # don't hand-roll the layout, just exec the upstream installer.
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep 'cyrius *= *"' cyrius.cyml 2>/dev/null | head -1 | sed 's/.*"\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_VERSION="$CYRIUS_VERSION" sh "cyrius-$CYRIUS_VERSION-x86_64-linux/install.sh"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Resolve dependencies
        # Pulls cyrius.cyml [deps].stdlib into lib/. Manifest currently
        # lists only stdlib deps (chrono, hashmap, etc.); termios is
        # deferred per roadmap M2 "Pre-M2 — TTY/termios lib extraction".
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/shu

      - name: Verify ELF
        # `7f 45 4c 46` = ELF magic. Cheap sanity that the build
        # produced an actual Linux executable, not a partial output.
        run: xxd -l 4 build/shu | grep -q "7f45 4c46"

      - name: Format check
        # Added at v0.8.0. chakshu had no fmt gate while its siblings did, and
        # real drift accumulated unnoticed in src/processes.cyr and src/tui.cyr
        # — both from the v0.7.15 sampling rework, neither caught by anything.
        #
        # `cyrius fmt <file>` REWRITES IN PLACE and prints nothing; the
        # non-mutating gate is `--check`, which exits non-zero and names the
        # first differing line. (The older diff-against-stdout idiom reports
        # every file as drifted under 6.5.x, because stdout is always empty.)
        #
        # Canonical continuation indent is 2 spaces per open paren (4 also
        # accepted) — NOT alignment to the open paren, which is the habit that
        # produced the drift this gate now catches.
        run: |
          fail=0
          for f in src/*.cyr tests/*.tcyr ai/*.cyr ai/tests/*.tcyr; do
            [ -f "$f" ] || continue
            cyrius fmt --check "$f" || fail=1
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Lint
        # Every src file clean; the only tolerated warning is the
        # `exceeds 120 characters` rule on comment-divider lines
        # (cosmetic only). Anything else is a hard fail.
        #
        # cyrius lint exits non-zero when it has anything to report
        # (even "0 warnings"), so both the tool invocation and the
        # inner grep need `|| true` to coexist with the implicit
        # `set -e` on `run:` blocks.
        run: |
          fail=0
          for f in src/*.cyr; do
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            bad=$(echo "$out" | grep -E '^\s*warn ' | grep -v 'exceeds 120 characters' || true)
            if [ -n "$bad" ]; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: non-cosmetic warnings present"; exit 1; }

      - name: Test
        # Explicit path — bare `cyrius test` (no arg) relies on
        # auto-discovery that has varied between cyrius releases
        # (failed in darshana CI on 5.10.20 with "No .tcyr files
        # found in tests/tcyr/ or tests/" despite the file being
        # checked in). The documented form per `cyrius help test`
        # is `cyrius test <test.cyr>`; using it explicitly avoids
        # the discovery surface entirely.
        run: cyrius test tests/chakshu.tcyr

      - name: Smoke test (M0–M1 surface)
        # scripts/smoke.sh exercises the closed milestones — version
        # / help parity, plain-snapshot shape, --sort/--top behavior,
        # error-exit-code matrix. Bash (not /bin/sh dash) — the script
        # uses process substitution.
        run: bash scripts/smoke.sh build/shu

      - name: PTY integration smoke (M2 TUI surface)
        # tests/integration_smoke.py spawns shu under a real PTY (so
        # tty_raw succeeds), drives recorded keystrokes covering each
        # mode (Normal / Filter / Confirm-Kill) plus arrow CSI
        # sequences, and asserts on output substrings + exit code.
        # Catches TUI-path regressions that the parser-level unit
        # tests can't see — patterned on cyim/tests/integration_smoke.py.
        # Sets the PTY winsize to 24x80 so chakshu's tty_winsize
        # returns non-zero rows/cols (pty.fork() default is 0x0).
        run: python3 tests/integration_smoke.py build/shu

      - name: Build + test shu-ai (AI variant)
        # The AI build lives in ai/ as a sub-project: it shares the
        # monitor source via ../src/* (CYRIUS_ALLOW_PARENT_INCLUDES=1
        # permits the parent-dir includes cyrius blocks by default) and
        # adds src/ai.cyr + the sandhi/niyama dep chain. Builds `shu-ai`
        # and runs the AI test suite (redaction / prompt / JSON marshalling).
        env:
          CYRIUS_ALLOW_PARENT_INCLUDES: "1"
        run: |
          cd ai
          cyrius deps
          mkdir -p build
          cyrius build main.cyr build/shu-ai
          xxd -l 4 build/shu-ai | grep -q "7f45 4c46"
          cyrius test tests/chakshu-ai.tcyr
          # Run the SAME smoke script against shu-ai that release.yml does.
          #
          # Added at v0.8.2 after this exact gap broke two release runs while CI
          # stayed green: release.yml drives scripts/smoke.sh over BOTH binaries
          # (build/shu, then build/shu-ai), but CI only ever ran it against the
          # lean one. Any assertion that is true for `shu` and false for
          # `shu-ai` — e.g. `--with-logs`, which lean refuses and shu-ai accepts
          # — therefore could not fail until a tag was already pushed.
          # Whatever release runs, CI must run first.
          bash ../scripts/smoke.sh build/shu-ai

      - name: with-logs privacy smoke (shu-ai)
        # v0.8.1. --with-logs widens what reaches an AI prompt, so it is exactly
        # the change that could reopen the redaction holes closed in v0.7.13 —
        # and it would do so silently, because nothing else asserts on prompt
        # CONTENTS. This is a hard gate, not continue-on-error: unlike the
        # hoosh-stub smoke it needs no gateway and no libc networking, since the
        # unreachable-gateway fallback prints the prompt that would have been
        # sent.
        run: python3 tests/with_logs_smoke.py ai/build/shu-ai

      - name: hoosh-stub smoke (shu-ai --explain end-to-end)
        # Stands up a tiny OpenAI-shaped gateway and runs `shu-ai --explain`
        # against it (design-spec §10 / roadmap "--explain returns something
        # model-shaped" gate): exercises the sandhi HTTP POST, content
        # extraction, and the bearer-token header for real.
        #
        # PROMOTED TO A HARD GATE at v0.8.2 — this was the last
        # continue-on-error step in either workflow.
        #
        # It carried this note for five releases: "sandhi resolves DNS via
        # fdlopen→libc getaddrinfo, which does NOT work in a no-libc/sandboxed
        # context". That diagnosis was wrong on every count. sandhi has an
        # IPv4-literal fast path (sandhi_net_parse_ipv4) and its own UDP DNS
        # resolver — written precisely because fdlopen/getaddrinfo was blocked —
        # so a numeric localhost URL never touches libc. Verified directly: the
        # POST connects, the stub receives it, and it returns 200.
        #
        # The real defect was in chakshu: _ai_extract_content searched for the
        # fixed literal `"content":"` and so could not parse `"content": "..."`
        # — which is Python json.dumps' default output, i.e. exactly what the
        # stub emits. The parse failure was then returned as -1, the TRANSPORT
        # code, so a 200 response printed "hoosh unreachable" and sent everyone
        # looking at the network. Both are fixed at v0.8.2; the gate passes.
        run: python3 tests/hoosh_stub_smoke.py ai/build/shu-ai

      - name: DCE parity check
        # Release builds set CYRIUS_DCE=1 to dead-code-eliminate
        # unused stdlib functions. The DCE'd binary must produce the
        # same observable behavior as the debug build, or the DCE
        # pass dropped something live.
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/shu-dce
          echo "shu-dce: $(wc -c < build/shu-dce) bytes"
          bash scripts/smoke.sh build/shu-dce

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for forbidden patterns in src/
        # Encodes the CLAUDE.md "Don't" invariants: no libc, no FFI,
        # no ncurses; AI prompts must not touch /home, env, or raw
        # cmdline. M1 ships only the /proc reader + plain renderer,
        # so most rules below are forward-looking guards. The AI
        # privacy block stays inert until src/ai/ lands at M3.
        run: |
          FAIL=0

          # CLAUDE.md "Don't introduce libc / FFI / ncurses". cffi /
          # dynlib / fdlopen / pam are the FFI on-ramps in the cyrius
          # stdlib; importing any of them violates the sovereign-stack
          # rule. Tolerate references in comments — only flag includes
          # / function calls.
          ffi_hits=$(grep -rnE 'include "lib/(cffi|dynlib|fdlopen|pam)\.cyr"' src/ 2>/dev/null || true)
          if [ -n "$ffi_hits" ]; then
            echo "FAIL: FFI/dynlib/pam library import"
            echo "$ffi_hits"
            FAIL=1
          fi

          # CLAUDE.md "heap-allocate large data", threshold 64 KiB.
          #
          # R20 (v0.7.13 P-1 sweep): this compared the BRACKET LITERAL against
          # 65536 while calling it "bytes". Element size in Cyrius is
          # scope-dependent — measured on 6.5.35:
          #   module-scope `var X[N]`  -> N x 8 bytes (.bss)
          #   function-local `var X[N]` -> N x 1 byte  (stack)
          # so the old rule was 8x too lenient for globals and correct for
          # locals. A blanket x8 would be worse: it flags 17 sites of which 16
          # are legitimate stack buffers and would red the first push. Two rules
          # instead, distinguished by column-1 anchoring (`var` at the start of
          # a line is module scope; indented is a local).
          #
          # Also NR -> FNR: NR is cumulative across the whole glob, so every
          # reported line number after the first file was wrong.
          # Escape hatch: a line carrying `# bigbuf-ok:` plus a reason is skipped.
          # Deliberate exceptions stay VISIBLE and reviewed in the diff rather
          # than being hidden by quietly loosening the threshold.
          awk '
            /bigbuf-ok:/ { next }
            /^var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n * 8 >= 65536) print FILENAME":"FNR": large module-scope buffer ("n" elems = "n*8" bytes): "$0
              next
            }
            /^[ \t]+var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"FNR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr > /tmp/bigbuf.txt
          if [ -s /tmp/bigbuf.txt ]; then
            cat /tmp/bigbuf.txt
            FAIL=1
          fi

          # M3+ AI-privacy guards. CLAUDE.md: prompts carry only what the user
          # can already see in the TUI — no /home contents, no env vars, no
          # unredacted cmdline.
          #
          # R19 (v0.7.13 P-1 sweep): this was guarded by `if [ -d src/ai ]` and
          # had therefore NEVER EXECUTED — the AI module landed at M3 as the
          # FILE src/ai.cyr, not a directory, so the most privacy-critical gate
          # in the repo was dead scaffolding for five releases. Re-pointed at the
          # real paths.
          AI_SRC=""
          [ -f src/ai.cyr ] && AI_SRC="$AI_SRC src/ai.cyr"
          [ -f src/ai_stub.cyr ] && AI_SRC="$AI_SRC src/ai_stub.cyr"
          for f in ai/*.cyr; do [ -f "$f" ] && AI_SRC="$AI_SRC $f"; done
          if [ -n "$AI_SRC" ]; then
            echo "AI privacy scan over:$AI_SRC"
            home_hits=$(grep -n '"/home/' $AI_SRC 2>/dev/null || true)
            if [ -n "$home_hits" ]; then
              echo "FAIL: AI prompt path references /home/"
              echo "$home_hits"
              FAIL=1
            fi
            # getenv-equivalent in cyrius is the `env` lib. chakshu legitimately
            # reads three CHAKSHU_* settings through one helper, so allowlist by
            # ARGUMENT rather than by name: the generic body is `getenv(name)`,
            # and every caller passes a CHAKSHU_* literal. Anything reading a
            # different env var is a finding.
            env_hits=$(grep -n 'env_get\|getenv' $AI_SRC 2>/dev/null \
              | grep -v 'getenv(name)' \
              | grep -v 'CHAKSHU_' || true)
            if [ -n "$env_hits" ]; then
              echo "FAIL: AI prompt path reads a non-CHAKSHU_ env var"
              echo "$env_hits"
              FAIL=1
            fi
          else
            echo "FAIL: AI privacy scan found no AI sources — the gate is dead again"
            FAIL=1
          fi

          # CLAUDE.md "AI is opt-in at the BINARY level": the lean `shu` must not
          # be able to reach the network at all. The root manifest must carry no
          # transport module. Note sandhi is consumed as a STDLIB entry, not a
          # [deps.sandhi] table, so scanning for dep tables alone misses it.
          lean_net=$(sed -n '/^\[deps\]/,/^\[/p' cyrius.cyml \
            | grep -oE '"(sandhi|net|http|tls|ws|dynlib|fdlopen|niyama)"' || true)
          if [ -n "$lean_net" ]; then
            echo "FAIL: lean cyrius.cyml declares a network/AI module: $lean_net"
            FAIL=1
          fi

          # Signal-mask hygiene. darshana's `tty_open_signalfd` does a
          # SIG_BLOCK before creating the fd, so a signalfd MUST be torn
          # down with `tty_close_signalfd(fd, mask)` (closes AND unblocks),
          # never a bare `file_close`. Closing alone strands HUP/INT/TERM
          # and WINCH blocked for the process lifetime — and a blocked mask
          # survives execve. Regressed through v0.7.12; fixed in 0.7.13.
          # The unit suite pins darshana's contract; this pins the call site.
          sfd_hits=$(grep -rnE 'file_close\(\s*sfd' src/ 2>/dev/null || true)
          if [ -n "$sfd_hits" ]; then
            echo "FAIL: signalfd closed with bare file_close — use tty_close_signalfd(fd, mask)"
            echo "$sfd_hits"
            FAIL=1
          fi

          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        # The set below is what chakshu commits to maintaining at
        # v0.2.0. SECURITY.md / CODE_OF_CONDUCT.md will join when we
        # have content for them — not before.
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md LICENSE \
                   cyrius.cyml CLAUDE.md \
                   docs/design-spec.md docs/development/roadmap.md \
                   docs/development/state.md docs/adr/0001-binary-name-shu.md; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        # Single source of truth is the VERSION file. Three derived
        # surfaces must agree: the CHANGELOG section header, the
        # cyrius.cyml indirection, and CHAKSHU_VERSION baked into the
        # binary by src/cli.cyr (shared by both shu and shu-ai). CI
        # fails closed on drift — version bump is a deliberate
        # per-milestone act per CLAUDE.md, not a fix-up after the fact.
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -qE "^## \[${VERSION}\]" CHANGELOG.md \
            || { echo "FAIL: CHANGELOG.md missing section [${VERSION}]"; exit 1; }
          grep -qE '^version *= *"\$\{file:VERSION\}"' cyrius.cyml \
            || { echo "FAIL: cyrius.cyml version no longer pulls from VERSION"; exit 1; }
          grep -qE "CHAKSHU_VERSION *= *\"chakshu ${VERSION}\"" src/cli.cyr \
            || { echo "FAIL: CHAKSHU_VERSION in src/cli.cyr != $VERSION"; exit 1; }
          echo "Version consistent: VERSION = CHANGELOG = cyrius.cyml = CHAKSHU_VERSION = $VERSION"
